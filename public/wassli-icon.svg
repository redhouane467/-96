<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Wassli (وصلي) delivery scooter brand mark. Original artwork for this project. -->
  <rect width="512" height="512" rx="96" fill="#16a34a"/>

  <!-- ground shadow -->
  <ellipse cx="262" cy="396" rx="150" ry="13" fill="#065f46" fill-opacity="0.35"/>

  <!-- rear delivery box -->
  <rect x="112" y="206" width="102" height="90" rx="14" fill="#ffffff"/>
  <rect x="127" y="223" width="72" height="7" rx="3.5" fill="#16a34a"/>
  <rect x="127" y="239" width="72" height="7" rx="3.5" fill="#16a34a"/>
  <rect x="127" y="255" width="50" height="7" rx="3.5" fill="#16a34a"/>

  <!-- flat running board from box to seat base -->
  <path d="M214 298 L 300 298"
        fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round"/>

  <!-- rounded seat bump -->
  <path d="M280 298 C 280 270, 300 254, 326 254 C 352 254, 366 270, 366 292"
        fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step down from seat to front footboard -->
  <path d="M366 292 L 366 298 L 402 298"
        fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- front fork rising to handlebar -->
  <path d="M402 298 L 402 268 C 402 254, 410 244, 422 236 L 452 214"
        fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- handlebar grip -->
  <circle cx="460" cy="207" r="15" fill="#ffffff"/>

  <!-- headlight -->
  <circle cx="402" cy="278" r="8" fill="#fbbf24"/>

  <!-- rear wheel -->
  <circle cx="212" cy="336" r="48" fill="#0f172a"/>
  <circle cx="212" cy="336" r="20" fill="#ffffff"/>
  <!-- front wheel -->
  <circle cx="384" cy="336" r="48" fill="#0f172a"/>
  <circle cx="384" cy="336" r="20" fill="#ffffff"/>
</svg>
